[project]
name = "assent-worker"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["assent-api", "assent-agents", "assent-evals", "arq>=0.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assent_worker"]
