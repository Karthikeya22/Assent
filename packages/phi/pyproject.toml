[project]
name = "assent-phi"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.8", "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assent_phi"]

[tool.hatch.metadata]
allow-direct-references = true
