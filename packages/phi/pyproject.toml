[project]
name = "assent-phi"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assent_phi"]
